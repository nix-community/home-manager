[accounts.example]
default = true
precision = "minute"

[[accounts.example.cycles]]
duration = 1500
name = "Work"

[[accounts.example.cycles]]
duration = 500
name = "Rest"

[accounts.example.hooks.on-timer-stop]
command = "echo timer stopped"

[accounts.example.hooks.on-work-begin.notify]
body = "Work started!"
summary = "Comodoro"

[accounts.example.socket]
default = true

[accounts.example.tcp]
host = "localhost"
port = 8080
