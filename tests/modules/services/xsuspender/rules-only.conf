[Chromium]
auto_suspend_on_battery=true
downclock_on_battery=2
exec_suspend=echo "suspend $PID"
match_wm_class_contains=chromium-browser
only_on_battery=false
resume_every=70
resume_for=8
send_signals=true
suspend_delay=5
suspend_subtree_pattern=chromium-old

[Default]
auto_suspend_on_battery=true
downclock_on_battery=0
only_on_battery=false
resume_every=50
resume_for=5
send_signals=true
suspend_delay=5

[Empty]
auto_suspend_on_battery=true
downclock_on_battery=0
only_on_battery=false
resume_every=50
resume_for=5
send_signals=true
suspend_delay=5
