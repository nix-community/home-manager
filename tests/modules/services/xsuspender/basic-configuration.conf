[Browser]
auto_suspend_on_battery=true
downclock_on_battery=0
exec_resume=browser
match_wm_class_contains=browser
only_on_battery=false
resume_every=50
resume_for=10
send_signals=true
suspend_delay=5

[Chromium]
auto_suspend_on_battery=true
downclock_on_battery=0
exec_resume=echo "resume $PID"
exec_suspend=echo "suspend $PID"
match_wm_class_contains=chromium-browser
match_wm_name_contains=Google Chrome
only_on_battery=false
resume_every=70
resume_for=8
send_signals=true
suspend_delay=11
suspend_subtree_pattern=chromium

[Custom]
match_wm_class_contains=custom

[Default]
auto_suspend_on_battery=false
downclock_on_battery=2
only_on_battery=true
resume_every=45
resume_for=4
send_signals=false
suspend_delay=9

[Modern]
match_wm_class_contains=modern
